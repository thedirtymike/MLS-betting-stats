name: Daily MLS Stats Pipeline

on:
  schedule:
    # Runs daily at 11:00 UTC (6:00 AM EST)
    - cron: '0 11 * * *'
  # Enables a manual "Run Workflow" button in GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install soccerdata pandas lxml beautifulsoup4 requests

      - name: Run Scraper Script
        run: python fetch_mls_stats.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mls_schedule.csv mls_player_sot.csv mls_team_corners_sot.csv || true
          git diff-index --quiet HEAD || git commit -m "Auto-update MLS CSV stats [skip ci]"
          git push
